name: Android-APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CAPACITOR_VERSION: "8"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: |
          { npm ci || npm install; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Tests (Vitest)
        run: |
          { npm test; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Web-Build (Typecheck + Vite)
        run: |
          { npm run build; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Capacitor installieren
        run: |
          { npm install --no-save "@capacitor/core@${CAPACITOR_VERSION}" "@capacitor/cli@${CAPACITOR_VERSION}" "@capacitor/android@${CAPACITOR_VERSION}"; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Android-Projekt erzeugen und anpassen
        run: |
          { npx cap add android && node scripts/android-prepare.mjs; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: App-Icon und Startbild erzeugen
        continue-on-error: true
        run: |
          { npx --yes @capacitor/assets generate --android --assetPath resources; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Web-Inhalt ins Android-Projekt kopieren
        run: |
          { npx cap sync android; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # Gleiche Signatur über mehrere Builds hinweg, damit sich die App ohne Deinstallation aktualisieren lässt.
      # Bevorzugt aus dem Secret DEBUG_KEYSTORE_BASE64, sonst aus dem Actions-Cache (verfällt nach 7 Tagen ohne Build).
      - name: Signatur-Schlüssel aus Secret
        id: keystore_secret
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signatur-Schlüssel aus Cache
        if: steps.keystore_secret.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          { ./gradlew --no-daemon assembleDebug; } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: APK benennen
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="GalacticSyndicate-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Release mit APK anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Galactic Syndicate ${{ steps.apk.outputs.tag }}
          body: Automatisch gebaute Android-APK (Debug-Signatur, zum direkten Installieren).
          files: ${{ steps.apk.outputs.name }}

      # Schlägt der Build fehl, landet das Ende des Logs als Issue im Repository.
      - name: Fehlerbericht als Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build #${GITHUB_RUN_NUMBER} (Commit ${GITHUB_SHA}) ist fehlgeschlagen."
            echo
            echo "Lauf: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            tail -c 55000 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(kein Log vorhanden)"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "APK-Build #${GITHUB_RUN_NUMBER} fehlgeschlagen" --body-file "$RUNNER_TEMP/issue.md"
